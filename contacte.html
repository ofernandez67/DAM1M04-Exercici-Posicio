<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Contacte</title>
    <link rel="stylesheet" href="global.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Isometra&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <nav>
        <a href="index.html">Inici</a>
        <a href="productes.html">Productes</a>
        <a href="contacte.html">Contacte</a>
    </nav>
</header>

<main class="contacte-main">

    <h1>Contacta amb nosaltres</h1>

    <div class="contacte-grid">

        <section class="formulari-contacte">

            <h2>Envia'ns un missatge</h2>

            <form>

                <label for="nom">Nom</label>
                <input type="text" id="nom" name="nom">

                <label for="email">Email</label>
                <input type="email" id="email" name="email">

                <label for="missatge">Missatge</label>
                <textarea id="missatge" name="missatge"></textarea>

                <button type="submit">Enviar</button>

            </form>

        </section>

        <section class="informacio-contacte">

            <h2>Informació</h2>

            <p><strong>Adreça:</strong> Carrer Major, 123</p>

            <p><strong>Telèfon:</strong> 123 45 67 89</p>

            <p><strong>Horari:</strong> Dilluns a Divendres, 10:00 - 20:00</p>

            <div class="mapa">
                Mapa de localització
            </div>

        </section>

    </div>

</main>

<footer>
    <p>© 2025 Mercat de Cartes</p>
</footer>

</body>
</html>
